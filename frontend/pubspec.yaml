name: tinigsenyas
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.12.0
  sqflite: ^2.3.0
  path: ^1.8.3
  speech_to_text: ^7.0.0
  cupertino_icons: ^1.0.8
  intl: ^0.19.0

  # Core offline-first dependencies
  # tflite_flutter: ^0.11.0  # TODO: Re-add when JVM target issue resolved
  connectivity_plus: ^6.0.0
  shared_preferences: ^2.2.0
  path_provider: ^2.1.0
  provider: ^6.1.0
  permission_handler: ^11.0.0

  # For future model updates
  # flutter_downloader: ^1.12.0
  dio: ^5.4.0
  flutter_tts: ^4.2.5
  share_plus: ^13.3.1
